<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZARA</title>
  <link rel="stylesheet" href="zara.css">
</head>
<body data-app="zara">
  <header class="hdr">
    <nav class="hdr__nav">
      <a href="shop.html?gender=women">Woman</a>
      <a href="shop.html?gender=men">Man</a>
      <a href="shop.html">New In</a>
    </nav>
    <a class="logo" href="index.html">ZARA</a>
    <nav class="hdr__util">
      <a href="shop.html">Search</a>
      <a href="login.html" data-account-link>Log in</a>
      <a href="#">Bag (0)</a>
    </nav>
  </header>

  <main id="product">
    <div class="pdp">
      <div class="pdp__img" id="p-img"></div>
      <div class="pdp__info">
        <div class="pdp__cat" id="p-cat"></div>
        <h1 id="p-name"></h1>
        <div class="pdp__price" id="p-price"></div>

        <div class="pdp__label">Size</div>
        <div class="sizes" id="p-sizes"></div>

        <div id="fit-panel"></div>

        <button class="btn">Add to bag</button>
        <p class="pdp__material" id="p-material"></p>
      </div>
    </div>
  </main>

  <footer class="ftr">
    <span>ZARA — Demo storefront</span>
    <span>Connect FitMe for personalised sizing</span>
  </footer>

  <script src="/shared/api.js"></script>
  <script src="/shared/store.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — ZARA</title>
  <link rel="stylesheet" href="zara.css">
</head>
<body data-app="zara">
  <header class="hdr">
    <nav class="hdr__nav"><a href="shop.html?gender=women">Woman</a><a href="shop.html?gender=men">Man</a><a href="shop.html">New In</a></nav>
    <a class="logo" href="index.html">ZARA</a>
    <nav class="hdr__util"><a href="shop.html">Search</a><a href="login.html" data-account-link>Log in</a><a href="#">Bag (0)</a></nav>
  </header>

  <main class="page-narrow">
    <h1>Account</h1>
    <p class="lead">Log in or create an account to shop and connect FitMe.</p>
    <div class="tabs">
      <button data-mode="login" class="is-active">Log in</button>
      <button data-mode="register">Register</button>
    </div>
    <form id="auth-form">
      <label>Email<input type="email" id="auth-email" required></label>
      <label>Password<input type="password" id="auth-password" minlength="6" required></label>
      <p class="form-error" id="auth-error"></p>
      <button class="btn" id="auth-submit" type="submit">Log in</button>
    </form>
  </main>

  <script src="/shared/api.js"></script>
  <script src="/shared/store.js"></script>
</body>
</html>
